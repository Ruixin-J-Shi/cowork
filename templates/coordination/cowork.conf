# cowork configuration — sourced by every coordination/bin/*.sh script (plain shell syntax).
PROJECT_NAME="@@PROJECT@@"
SEATS=@@SEATS@@
PROJECT_ROOT_REL=""   # leave empty: the project root is derived from the tree (coordination/teams/seat-N/… nest under it)

# Liveness thresholds (minutes)
HEARTBEAT_MIN=30      # a seat with open work writes an outbox line at least this often (the window starts at IN_PROGRESS)
DEAD_MIN=90           # outbox silent this long with open work, and territories quiet = dead by evidence → takeover/reassign
STALL_MIN=45          # lead-watch: no writes anywhere for this long → exit 3 (stall alarm)

# Watch fallbacks (seconds) — the loops re-arm after these even if nothing changed
WATCH_TIMEOUT=600
LEAD_WATCH_TIMEOUT=3000

# Where seats write, relative to the project root. Colon-separated like PATH (so a path may contain spaces);
# plain spaces also separate when no colon is present. Must resolve inside the project. Used for stall detection and liveness.
TERRITORIES="@@TERRITORIES@@"
# Optional per-slot territories (same format). With these set, a dead seat cannot hide behind a busy sibling:
# liveness for seat-N looks only at TERRITORY_N. Keep in step with PLAN.md's ownership map.
# TERRITORY_1="src"
# TERRITORY_2="tests"
# Optional display labels for slots (a director's slots are usually team leads): LABEL_1="backend-lead"

# Optional phone notifications via ntfy (leave empty to disable). See hooks/ntfy-hook.sh.
NTFY_TOPIC=""
NTFY_TOPIC_LEAD=""
